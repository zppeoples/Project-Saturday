page==='Rankings'){html=card('PP BCS™ Ranking Engine',rankingView(false))}else if(page==='Teams'){html=`<section class="card"><h2>Team Profiles</h2><label for="team">Select team</label><select id="team" onchange="selected=this.value;render()">${Object.values(leagueData.standings).flat().map(r=>option(r[0],r[0],selected)).join('')}</select></section>`;const i=teamInfo(selected);html+=card(teamBadge(selected,true),`<p>${i.c} · <b>${i.overall}</b> overall · <b>${i.conf}</b> conference</p>${teamProfileStats(selected,i.c)}`)}else if(page==='Schedule'){html=weeklySchedule()}else if(page==='Media'){html=coachMedia()}else if(page==='Uploads'){html=card('Screenshot Intake',`<div class="notice">Screenshots stay on your device in this prototype. This version previews images but does not extract stats or upload them to a server.</div><p>Choose screenshots of standings, scores or statistics to preview before future imports.</p><label for="screens">Select game screenshots</label><input id="screens" type="file" accept="image/*" multiple onchange="previewScreens(this)"><div id="screensResult" class="previewgrid"></div><p class="muted">Next upgrade: image reading, review of extracted numbers, and commissioner approval before updating the database.</p>`)}else if(page==='Commissioner'){html=commissionerDashboard()}el.innerHTML=(publicError && page!=='Commissioner' && page!=='Media' ? `<p class="notice" role="status">${safe(publicError)}</p>` : '')+html}function go(t){if(t==='Schedule'&&page!==t) scheduleWeek=leagueData.week;if(t==='Rankings'&&page!==t) rankingWeek=leagueData.week;page=t;render();window.scrollTo(0,0)}function openTeam(t){selected=t;go('Teams')}function previewScreens(input){const out=document.getElementById('screensResult');out.replaceChildren();for(const f of [...input.files].slice(0,12)){const fig=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption');im.src=URL.createObjectURL(f);im.onload=()=>URL.revokeObjectURL(im.src);im.alt='Screenshot preview';cap.textContent=f.name;fig.append(im,cap);out.append(fig)}}
</script><script src="league-config.js"></script><script src="dashboard.js"></script></body></html>
